<meta name="theme-color" content="#0C1A20" media="(prefers-color-scheme: dark)">

<title>USA 2026 — Itinerario</title>
<style>
:root{
  --paper:#F0EDE4;
  --card:#FFFFFF;
  --text:#1D2E33;
  --text-2:#3A3A34;
  --muted:#6E685C;
  --line:#DBD5C7;
  --node:#11333F;
  --dash:#2C5A66;
  --time:#2C5A66;
  --ochre:#C8891B;
  --rust:#A2431C;
  --alert-bg:#FBF2ED;
  --header-bg:#11333F;
  --header-fg:#F4F1E8;
  --chip-line:rgba(244,241,232,.28);
  --chip-on-fg:#1A1206;
  --notice-bg:#1B4351;
  --notice-fg:#CFE0E2;
  --btn-bg:#11333F;
  --btn-fg:#F4F1E8;
  --btn-2-fg:#2C5A66;
  --band-op:.20;
  --display:'Avenir Next Condensed','Helvetica Neue',system-ui,sans-serif;
  --body:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0C1A20;
    --card:#152A32;
    --text:#E7E3D6;
    --text-2:#C3C0B4;
    --muted:#8C9AA0;
    --line:#26404A;
    --node:#7FB2BF;
    --dash:#4E7D8B;
    --time:#8FC4D1;
    --ochre:#E2A93E;
    --rust:#E08A5C;
    --alert-bg:#241A16;
    --header-bg:#081318;
    --header-fg:#E7E3D6;
    --chip-line:rgba(231,227,214,.24);
    --chip-on-fg:#12100A;
    --notice-bg:#132630;
    --notice-fg:#9DB4BC;
    --btn-bg:#2E7285;
    --btn-fg:#F2F7F8;
    --btn-2-fg:#8FC4D1;
    --band-op:.26;
  }
}

/* colore d'accento della regione: impostato su <main> giorno per giorno */
main{--accent:var(--accent-l)}
@media (prefers-color-scheme: dark){ main{--accent:var(--accent-d)} }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--text);font-family:var(--body);
  font-size:16px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}

header{
  background:var(--header-bg);color:var(--header-fg);
  padding:calc(env(safe-area-inset-top) + 14px) 16px 0;
  position:sticky;top:0;z-index:20;
}
.topline{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.trip{
  font-family:var(--display);text-transform:uppercase;
  letter-spacing:.14em;font-size:13px;font-weight:600;
  opacity:.75;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tab{
  border:1px solid var(--chip-line);background:none;color:var(--header-fg);border-radius:2px;
  padding:5px 10px 4px;font-family:var(--display);text-transform:uppercase;
  letter-spacing:.08em;font-size:12px;font-weight:600;cursor:pointer;
}
.tab[aria-pressed="true"]{background:var(--header-fg);color:var(--header-bg);border-color:var(--header-fg)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--chip-line);background:none;
  color:var(--header-fg);border-radius:2px;padding:7px 12px 6px;
  font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
  font-size:13px;font-weight:600;cursor:pointer;position:relative;
}
.chip[aria-pressed="true"]{background:var(--ochre);border-color:var(--ochre);color:var(--chip-on-fg)}
.chip.oggi::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-4px;
  width:4px;height:4px;border-radius:50%;background:var(--ochre)}
.chip[aria-pressed="true"].oggi::after{background:var(--header-fg)}
.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

.notice{background:var(--notice-bg);color:var(--notice-fg);font-size:13px;padding:8px 16px;text-align:center}

main{padding:0 0 64px;max-width:640px;margin:0 auto}
.pad{padding:0 16px}

/* fascia disegnata della regione */
.band{color:var(--accent);opacity:var(--band-op);margin:0 0 -6px}
.band svg{display:block;width:100%;height:78px}

.region{
  font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;
  font-size:11.5px;font-weight:700;color:var(--accent);margin:14px 0 5px;
}
.route{
  font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;
  font-size:27px;line-height:1.1;font-weight:700;margin:0 0 6px;
}
.route.lungo{font-size:22px}
.route em{font-style:normal;color:var(--accent)}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:0 0 14px;letter-spacing:.02em}

.wholeday{
  display:flex;align-items:center;gap:12px;text-decoration:none;
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:3px;padding:12px 14px;margin:0 0 20px;color:inherit;
}
.wholeday .lbl{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:13px;font-weight:600}
.wholeday .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.wholeday .arrow{margin-left:auto;color:var(--accent);font-size:19px;line-height:1}
.wholeday:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.alert{
  border-left:3px solid var(--rust);background:var(--alert-bg);
  padding:11px 13px;margin:0 0 10px;font-size:14.5px;border-radius:0 3px 3px 0;
  white-space:pre-line;
}
.alert b{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;
  font-size:12px;color:var(--rust);display:block;margin-bottom:2px}
.alert.nota{border-left-color:var(--accent)}
.alert.nota b{color:var(--accent)}

.strip{position:relative;margin:24px 0 0;padding-left:26px}
.strip::before{content:"";position:absolute;left:5px;top:8px;bottom:34px;width:2px;background:var(--line)}
.leg{position:relative;font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:9px 0;letter-spacing:.03em}
.leg::before{
  content:"";position:absolute;left:-21px;top:0;bottom:0;width:2px;
  background:repeating-linear-gradient(to bottom,var(--dash) 0 5px,transparent 5px 10px);
}
.stop{position:relative;margin:0 0 4px}
.stop::before{
  content:"";position:absolute;left:-25px;top:7px;width:11px;height:11px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--node);
}
.stop.key::before{background:var(--accent);border-color:var(--accent)}
.time{font-family:var(--mono);font-size:12.5px;color:var(--time);font-weight:600;letter-spacing:.02em}
.name{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.01em;margin:1px 0 3px}
.desc{font-size:14.5px;color:var(--text-2);margin:0 0 9px;white-space:pre-line}

.nav{display:flex;gap:7px;margin:0 0 9px;flex-wrap:wrap}
.btn{
  display:inline-block;text-decoration:none;
  font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
  font-size:12px;font-weight:600;padding:8px 13px;border-radius:2px;
}
.btn-a{background:var(--btn-bg);color:var(--btn-fg)}
.btn-g{background:none;color:var(--btn-2-fg);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* tendine attaccate alla singola tappa */
.more{margin:0 0 18px}
details{
  background:var(--card);border:1px solid var(--line);
  border-radius:3px;margin:0 0 6px;overflow:hidden;
}
summary{
  cursor:pointer;list-style:none;padding:10px 12px;
  font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
  font-size:12px;font-weight:600;color:var(--btn-2-fg);
}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;font-size:15px;color:var(--muted);line-height:1}
details[open] summary::after{content:"–"}
details[open]{border-left:3px solid var(--accent)}
.body{padding:0 12px 12px;font-size:14px;white-space:pre-line;color:var(--text-2)}
a.tel,a.web{color:var(--btn-2-fg)}

.section{
  font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;
  font-size:12px;color:var(--muted);margin:26px 0 11px;
  padding-bottom:6px;border-bottom:1px solid var(--line);
}
.hotel{
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:3px;padding:12px 14px;display:flex;align-items:center;gap:12px;
}
.hotel .nome{font-family:var(--display);font-size:19px;font-weight:600}

.nightrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rowaccent);
  border-radius:3px;padding:11px 13px;margin:0 0 8px;color:inherit;font:inherit;cursor:pointer}
.nightrow:focus-visible{outline:2px solid var(--rowaccent);outline-offset:2px}
.nightrow .quando{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:58px}
.nightrow .dove{font-family:var(--display);font-size:17px;font-weight:600;flex:1;line-height:1.2}
.nightrow .dove small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;
  letter-spacing:.06em;text-transform:uppercase;color:var(--rowaccent);margin-top:2px}
.nightrow .freccia{color:var(--rowaccent);font-size:19px;line-height:1}
.totali{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:14px 0 0;line-height:1.7}

footer{text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);padding:26px 16px 40px}
@media(prefers-reduced-motion:no-preference){
  main{animation:in .25s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}
</style>
</head>

domani sveglia per partire alle 8:00.", "grave": false}], "pranzo": "ATTENZIONE - E' DOMENICA. In Utah e Star Valley chiude quasi tutto.\nCHIUSI: LaBeau's, Zipz e Salty Bear a Garden City (niente frullato al lampone), Star Valley Roadhouse e Sourdough Nest ad Afton.\n\n>> PRANZO A LOGAN verso le 13:15, ultima citta vera prima del canyon. Fate qui anche la SPESA PER LA CENA.\nIn-N-Out!!!", "cena": "Thayne non ha nulla aperto la domenica sera (Graze chiude alle 14).\n>> Cena con la spesa fatta a Logan."}, {"data": "2026-09-14", "etichetta": "Lun 14", "regione": "Grand Teton", "aL": "#2E6E7E", "aD": "#7FC3D4", "svg": "<path d=\"M0,80 L0,66 L28,50 L44,60 L72,26 L88,44 L104,34 L124,54 L150,18 L172,46 L188,38 L206,58 L232,30 L252,52 L274,42 L300,62 L322,50 L348,64 L372,56 L400,68 L400,80 Z\"/>", "da": "Thayne", "a": "Teton Village", "via": "", "km": 155, "guida": "2h30", "dormire": "Teton Village", "costo": "212", "segmenti": [{"da": "Thayne", "a": "Jackson", "km": 88, "t": "1h00", "tappe": [{"ora": "8:00", "testo": "partenza da Thayne (colazione da Graze, apre alle 8).", "luogo": "Graze, 100 Wright St, Thayne, WY 83127"}, {"ora": "8:40–9:40", "testo": "SNAKE RIVER CANYON: 35 km fra Alpine e Hoback Junction, 2-3 pullout. Se ci sono i rafting in acqua, e lo spettacolo migliore.", "luogo": "West Table Boating Site, Alpine, WY"}, {"ora": "10:00–11:45", "testo": "JACKSON: parcheggio gratuito angolo West Gill / North Center. Town Square con i 4 archi di corna, Cache St, Million Dollar Cowboy Bar.", "luogo": "Home Ranch Lot, 210 N Cache St, Jackson, WY"}, {"ora": "11:45–12:30", "testo": "pranzo a Jackson.", "luogo": "Miazga's, 399 W Broadway, Jackson, WY 83001"}]}, {"da": "Jackson", "a": "Jenny Lake", "km": 37, "t": "0h40", "tappe": [{"ora": "12:40–13:45", "testo": "NATIONAL MUSEUM OF WILDLIFE ART (opzionale ma consigliato): 4 km a nord sulla US-89, scavato nella collina sopra il National Elk Refuge.", "luogo": "National Museum of Wildlife Art, 2820 Rungius Rd, Jackson, WY"}, {"ora": "14:00", "testo": "ingresso Moose, sosta al Craig Thomas Visitor Center (mappa, stato sentieri).", "luogo": "Craig Thomas Discovery and Visitor Center, 1 Teton Park Rd, Moose, WY"}, {"ora": "14:45", "testo": "parcheggio South Jenny Lake.", "luogo": "Jenny Lake Visitor Center, Grand Teton National Park"}]}, {"da": "Jenny Lake", "a": "Teton Village", "km": 30, "t": "0h50", "tappe": [{"ora": "15:00", "testo": "BATTELLO Jenny Lake (orario 8-30 set: 9:00-17:00, ULTIMO ALLE 17:00. Non si prenota, biglietti all'East Boat Dock, circa 25 $ a testa a/r).", "luogo": "Jenny Lake Boating, Grand Teton National Park"}, {"ora": "15:15–16:45", "testo": "HIDDEN FALLS (800 m dal molo) + INSPIRATION POINT (1,6 km, salita ripida finale). Fate anche Inspiration Point: e il tratto che giustifica tutto il resto.\nSe al ritorno c'e coda al molo ovest: tornate a piedi lungo la sponda sud, 4 km piani in un'ora, spesso meno dell'attesa.", "luogo": null}, {"ora": "17:15–17:45", "testo": "STRING LAKE: riflessi di Teewinot e Mount Moran, quasi nessuno.", "luogo": "String Lake Trailhead, Grand Teton National Park"}, {"ora": "18:15–19:15", "testo": "MOOSE-WILSON ROAD a 25 all'ora: massima densita di orsi neri del parco, in iperfagia sulle bacche. Sawmill Ponds Overlook per gli alci. Tramonto 19:40.", "luogo": "Sawmill Ponds Overlook, Grand Teton National Park"}, {"ora": "19:30", "testo": "Teton Village. Cielo scuro e poco inquinamento luminoso: ottimo per le stelle.", "luogo": "Teton Village, Wyoming"}]}], "avvisi": [{"t": "NB: Paola suggerisce di evitarlo per code e costo e di partire dal Leigh Lake trailhead - ma da Leigh Lake NON si arriva a Hidden Falls, che sta sulla sponda opposta. A piedi dal parcheggio sud servono 4 km in piu a/r rispetto alla traversata.", "grave": true}, {"t": "COMPRATE A JACKSON i panini e l'acqua per il pranzo di domani a West Thumb.", "grave": false}, {"t": "VERIFICARE: cantieri Grand Teton (nps.gov/grte road-construction) e che la Moose-Wilson sia aperta. Piano B: Moose - US-89 sud - Jackson - WY-390.", "grave": true}], "pranzo": "COLAZIONE - Graze, 100 Wright St, Thayne. Apre lun ore 8, chiude 14. 4,9 stelle: livello da citta' grande. E' sulla strada.\n\nPRANZO - Miazga's, 399 W Broadway, Jackson. Apre 11:30, chiude 21. Cucina polacco-italiana, ottimo bison burger, prezzi normali per Jackson.\nAlt.: Roosevelts, 140 N Cache St, 11:30-21.\nEVITARE i locali sulla Town Square con menu in 4 lingue.\n\nComprate a Jackson i panini per il pranzo del 15/9.", "cena": "Corsa, 3275 Village Dr, Teton Village. 17:00-21:00. Italiano vero, pizza e pasta buone.\nMangy Moose (3295 Village Dr, fino alle 22): istituzione storica, atmosfera ottima ma cibo mediocre - andateci per una birra."}, {"data": "2026-09-15", "etichetta": "Mar 15", "regione": "Yellowstone", "aL": "#B0761A", "aD": "#E2A93E", "svg": "<path opacity=\".55\" d=\"M196,80 C196,58 200,40 204,22 C206,12 210,6 213,0 C216,6 220,12 222,22 C226,40 230,58 230,80 Z\"/><path d=\"M0,80 L0,64 C34,58 62,68 96,63 C132,57 158,69 196,64 C232,59 258,70 292,64 C330,57 360,67 400,61 L400,80 Z\"/>", "da": "Teton Village", "a": "Old Faithful, Yellowstone", "via": "", "km": 245, "guida": "3h20", "dormire": "Old Faithful Lodge Cabins", "costo": "135", "segmenti": [{"da": "Teton Village", "a": "Old Faithful, Yellowstone", "km": 245, "t": "3h20", "tappe": [{"ora": "6:00", "testo": "sveglia - 6:30 partenza da Teton Village.", "luogo": null}, {"ora": "7:10–7:45", "testo": "SCHWABACHER LANDING: alba alle 7:00. Riflessi sullo Snake River con l'acqua ancora ferma e la catena tutta illuminata.", "luogo": "Schwabacher Landing, Grand Teton National Park"}, {"ora": "8:00–8:50", "testo": "MORMON ROW: i fienili Moulton guardano a ovest, quindi sole alle spalle e Teton illuminati frontalmente. Picco del bramito dei wapiti nelle praterie intorno.", "luogo": "Mormon Row Historic District, Grand Teton National Park"}, {"ora": "9:05–9:20", "testo": "SNAKE RIVER OVERLOOK: il punto della foto di Ansel Adams del 1942 - oggi gli alberi sono cresciuti parecchio. E' IL SACRIFICABILE N.1 (+20 min).", "luogo": "Snake River Overlook, Grand Teton National Park"}, {"ora": "9:40–10:25", "testo": "OXBOW BEND: Mount Moran riflesso, pioppi gialli, alci e pellicani bianchi.", "luogo": "Oxbow Bend Turnout, Grand Teton National Park"}, {"ora": "11:20", "testo": "INGRESSO SUD YELLOWSTONE (10-15 min di coda, il casello piu tranquillo).", "luogo": "South Entrance Station, Yellowstone National Park, WY"}, {"ora": "12:10–13:15", "testo": "WEST THUMB + PANINO ai tavoli affacciati sul lago: Abyss Pool e Black Pool sono le due cose, 45 min bastano. (Niente pranzo seduti a Grant Village: si guadagna un'ora piena.)", "luogo": "West Thumb Geyser Basin, Yellowstone National Park"}, {"ora": "14:05", "testo": "FAIRY FALLS TRAILHEAD (NON il parcheggio di Midway: l'overlook e da qui, 1,5 km piu a sud. Se pieno, proseguite a Fountain Flat Drive).", "luogo": "Fairy Falls Trailhead, Yellowstone National Park"}, {"ora": "14:15–15:15", "testo": "GRAND PRISMATIC OVERLOOK: 800 m pianeggianti poi la deviazione a sinistra e meno di 10 minuti di salita. Circa 2 km a/r in tutto.", "luogo": null}, {"ora": "15:20–16:00", "testo": "MIDWAY GEYSER BASIN dal basso: Excelsior Geyser Crater e il fiume bollente.", "luogo": "Midway Geyser Basin, Yellowstone National Park"}, {"ora": "16:15", "testo": "OLD FAITHFUL, check-in.", "luogo": "Old Faithful Lodge Cabins, Yellowstone National Park"}, {"ora": "18:45", "testo": "ERUZIONE DI OLD FAITHFUL AL TRAMONTO (ogni ~90 min: una la prendete di sicuro). Verificate su GeyserTimes o al visitor center. A quest'ora la folla e gia molto ridotta.", "luogo": "Old Faithful Geyser, Yellowstone National Park"}, {"ora": "19:30", "testo": "cena all'Inn o allo Snow Lodge.\nDopo cena: l'Old Faithful sotto le stelle. Torcia e giacca vera, non felpa.\nNiente lasciato FUORI dalla cabina: veranda, tavolo, gradini. Dentro va tutto bene.", "luogo": "Old Faithful Inn, Yellowstone National Park"}]}], "avvisi": [{"t": "SI DORME ALL'OLD FAITHFUL (scelta confermata: geyser e vita nel villaggio storico, rinunciando all'alba in Hayden Valley).", "grave": false}, {"t": "OPZIONE A - UPPER GEYSER BASIN STASERA (se arrivate in orario e il cielo e sereno):\n16:30 visitor center per gli orari di Castle, Grand, Riverside e Daisy\n16:45-18:30 passerella fino alla MORNING GLORY POOL, 5 km a/r. L'ultima parte con la luce dorata sui coni (tramonto 19:45).", "grave": false}, {"t": "OPZIONE B - domattina (se arrivate stanchi o e nuvoloso): 17:30-18:30 hall dell'Old Faithful Inn, 7 piani di ballatoi e camino da 150 tonnellate, gelato al huckleberry.", "grave": false}, {"t": "NB: il BISCUIT BASIN resta CHIUSO dopo l'esplosione idrotermale del luglio 2024. Verificate su nps.gov/yell prima di contarci.", "grave": true}, {"t": "Le cabin Economy hanno il lavandino in camera ma il bagno in comune a 20-30 m: torcia, ciabatte, tappi per le orecchie (pareti sottili). Doccia la sera, non la mattina (fra le 7 e le 8:30 c'e coda).", "grave": false}], "pranzo": "PANINO AL SACCO comprato a Jackson il 14.\nSi mangia ai tavoli di WEST THUMB affacciati sul lago, 12:10-13:15.\nNiente pranzo seduti a Grant Village: si guadagna un'ora piena e si arriva al Grand Prismatic alle 14:15 invece che alle 15:00.", "cena": "Old Faithful Inn Dining Room oppure Snow Lodge, ore 19:30.\nPRENOTAZIONE: non esiste un link pubblico. Alloggiando in una struttura del parco diversa dall'Inn, ricevete un link esclusivo via email 30 GIORNI PRIMA - per il 15/9 intorno al 16 AGOSTO, da explore@e.yellowstonenationalparklodges.com. CONTROLLATE LO SPAM. Se non arriva: +1 307-344-7311.\nSenza prenotazione: cafeteria dell'Old Faithful Lodge (a due passi dalle cabin, sala affacciata sul geyser) o Bear Paw Deli / Geyser Grill.\nAbbigliamento casual: scarponi e pile vanno benissimo."}, {"data": "2026-09-16", "etichetta": "Mer 16", "regione": "Wapiti Valley", "aL": "#A2431C", "aD": "#E08A5C", "svg": "<path d=\"M0,80 L0,62 L26,62 L34,40 L48,40 L56,62 L92,62 L98,30 L112,30 L118,62 L156,62 L168,48 L182,48 L190,62 L236,62 L248,24 L262,24 L270,62 L306,62 L316,46 L330,46 L338,62 L400,62 L400,80 Z\"/>", "da": "Old Faithful", "a": "Cody", "via": "", "km": 245, "guida": "3h25", "dormire": "Cody", "costo": "139.07", "segmenti": [{"da": "Old Faithful", "a": "Cody", "km": 245, "t": "3h25", "tappe": [{"ora": "6:30", "testo": "sveglia.", "luogo": null}, {"ora": "7:00", "testo": "PRIMA ERUZIONE DELLA GIORNATA: verificate l'orario la sera prima. Con il vapore nell'aria fredda e quasi nessuno intorno e uno dei momenti migliori del parco.", "luogo": "Old Faithful Geyser, Yellowstone National Park"}, {"ora": "7:30–9:15", "testo": "UPPER GEYSER BASIN (se non fatto ieri sera): passerella pianeggiante fino alla MORNING GLORY POOL, circa 5 km a/r. La piu grande concentrazione di geyser al mondo, a quest'ora praticamente deserta. Soste a Castle, Grand, Riverside, Grotto.", "luogo": null}, {"ora": "9:15–9:45", "testo": "colazione al General Store o all'Inn. 9:45 check-out.", "luogo": "Old Faithful General Store, Yellowstone National Park"}, {"ora": "10:45–11:45", "testo": "NORRIS GEYSER BASIN: il bacino piu caldo, acido e instabile del parco. PORCELAIN BASIN (anello breve, distesa bianca lunare) e, se c'e tempo, l'inizio del Back Basin per lo STEAMBOAT, il geyser attivo piu alto del mondo (fino a 90 m).", "luogo": "Norris Geyser Basin, Yellowstone National Park"}, {"ora": "12:10–12:50", "testo": "CANYON VILLAGE: pranzo veloce al General Store + PIENO DI BENZINA (ultimo distributore affidabile prima di Cody, 220 km).", "luogo": "Canyon General Store, Canyon Village, Yellowstone National Park"}, {"ora": "12:50–13:40", "testo": "ARTIST POINT (South Rim): la Lower Falls e illuminata frontalmente fino alle 14, dopo va in ombra. E' il motivo per cui va fatto adesso.", "luogo": "Artist Point, Yellowstone National Park"}, {"ora": "13:45–14:30", "testo": "BRINK OF THE LOWER FALLS (North Rim): discesa di 600 m, 20 min giu e 30 su a 2.400 m di quota. E' l'unico punto dove ti affacci sul ciglio con l'acqua che sparisce sotto. RIPIEGO: Lookout Point, al livello del parcheggio.", "luogo": "Brink of the Lower Falls Trailhead, Yellowstone National Park"}, {"ora": "14:30", "testo": "PARTENZA DA CANYON - ORARIO DA RISPETTARE. Il tratto fino a Cody richiede 2h45 senza fermarsi: oltre le 14:30, Cody slitta dopo le 18.", "luogo": null}, {"ora": "14:30–15:15", "testo": "HAYDEN VALLEY in discesa, 2-3 pullout. Non e l'ora migliore (i branchi sono attivi all'alba e al tramonto) ma i bisonti ci sono comunque. Binocolo.\nSosta di 5 minuti a LE HARDY RAPIDS, fra Hayden Valley e Fishing Bridge.", "luogo": "Grizzly Overlook, Yellowstone National Park"}, {"ora": "15:30–15:40", "testo": "LAKE BUTTE OVERLOOK: 5 min di deviazione in salita, tutto lo Yellowstone Lake e, nelle giornate limpide, il profilo dei Teton in fondo.", "luogo": "Lake Butte Overlook, Yellowstone National Park"}, {"ora": "16:00–16:10", "testo": "SYLVAN PASS, 2.600 m. 16:20 East Entrance.", "luogo": "Sylvan Pass, Yellowstone National Park"}, {"ora": "16:20–17:30", "testo": "WAPITI VALLEY / Buffalo Bill Cody Scenic Byway: guglie vulcaniche erose, la Holy City, il Buffalo Bill Reservoir, tre tunnel scavati nella roccia. Sole alle spalle.", "luogo": "Wapiti Wayside, Cody, WY"}, {"ora": "17:00", "testo": "BUFFALO BILL DAM (facoltativo, 8 km prima di Cody): centro visitatori gratuito, si cammina sulla diga. 30-45 minuti.", "luogo": "Buffalo Bill Dam Visitor Center, Cody, Wyoming"}, {"ora": "17:30", "testo": "Cody.", "luogo": "Cody, Wyoming"}]}], "avvisi": [{"t": "GIRO VIA NORRIS (86 km fino ad Artist Point contro i 101 via Lake): coerente con l'aver scelto i geyser. Hayden Valley si attraversa in discesa nel pomeriggio.", "grave": false}, {"t": "NIENTE LAMAR VALLEY: ci si arriverebbe a mezzogiorno, quando lupi e orsi dormono, e si perderebbe tutta la parte est del parco.", "grave": false}, {"t": "DISTANZE DI SICUREZZA: almeno 23 m da bisonti e alci, 91 m da orsi e lupi. Un bisonte sul ciglio della strada blocca il traffico per diversi minuti: mettete in conto margine.", "grave": true}, {"t": "VERIFICARE la sera prima: Sylvan Pass aperto (nps.gov/yell o 307-344-2117). Se chiuso: North Entrance + Chief Joseph Scenic Byway, 2 ore in piu.", "grave": true}], "pranzo": "Pranzo veloce al CANYON GENERAL STORE, 12:10-12:50. Non il ristorante del lodge.\nQUI ANCHE IL PIENO DI BENZINA - ultimo distributore affidabile prima di Cody.\nColazione alle 9:15 all'Old Faithful General Store o all'Inn.\n\nNB: dentro Yellowstone si mangia generalmente caro. Il self service dell'Old Faithful resta sempre una valida opzione.", "cena": "Cody Steakhouse IMPERDIBILE 1367 Sheridan Ave. Mer 16:00-21:00. La prima bistecca vera del viaggio. Meglio prenotare: 307-586-2550.\nAlt. piu' informale: The Blanca Tatanka, 1455 Sheridan Ave, fino alle 23.\n\nAlternativa economica: ANNIE'S SODA SALOON & CAFE, 1124 16th St. Finto saloon retro con gelati e soda artigianale, sandwich e hot dog. Porzioni abbondanti e prezzi bassi."}, {"data": "2026-09-17", "etichetta": "Gio 17", "regione": "Wind River Canyon", "aL": "#6E4A3C", "aD": "#C09B86", "svg": "<path d=\"M0,80 L0,10 L30,20 L50,44 L60,68 L62,80 Z\"/><path d=\"M400,80 L400,14 L372,24 L350,46 L342,70 L340,80 Z\"/><path opacity=\".5\" d=\"M62,80 L62,72 L340,72 L340,80 Z\"/>", "da": "Cody", "a": "Casper", "via": "", "km": 347, "guida": "3h40", "dormire": "Casper", "costo": "125.67", "segmenti": [{"da": "Cody", "a": "Thermopolis", "km": 135, "t": "1h30", "tappe": [{"ora": "8:00–10:00", "testo": "BUFFALO BILL CENTER OF THE WEST (apre alle 8:00 dal 16/9). 5 musei: puntate su Plains Indian e Draper Natural History. Biglietto valido 2 giorni.", "luogo": "Buffalo Bill Center of the West, Cody, Wyoming"}, {"ora": "11:30–12:40", "testo": "HOT SPRINGS STATE PARK, Thermopolis: bagno gratuito da 20 minuti alla State Bath House (gratuito per contratto dal 1896, condizione imposta da Shoshone e Arapaho). Rainbow Terraces, ponte sospeso del 1916, bisonti. Pranzo.", "luogo": "Hot Springs State Park, Thermopolis, Wyoming"}]}, {"da": "Thermopolis", "a": "Casper", "km": 212, "t": "2h10", "tappe": [{"ora": "12:40–13:20", "testo": "WIND RIVER CANYON: pareti fino a 750 m, cartelli che indicano l'eta delle rocce - 500 milioni di anni di stratigrafia in 20 minuti. Fermatevi ai pullout. Siete sulla Wind River Indian Reservation: niente droni.", "luogo": "Wind River Canyon Scenic Byway, Thermopolis, WY"}, {"ora": "13:40", "testo": "Shoshoni: PIENO DI BENZINA prima di 160 km vuoti.", "luogo": "Shoshoni, Wyoming"}, {"ora": "15:15–17:00", "testo": "NATIONAL HISTORIC TRAILS CENTER, Casper - GRATUITO, CHIUDE ALLE 17:00. 7 gallerie, film di 18 min. E' il senso del 21/9: senza, Fort Laramie e Register Cliff restano cumuli di pietre.", "luogo": "National Historic Trails Interpretive Center, 1501 N Poplar St, Casper, WY"}]}], "avvisi": [{"t": "TOLTO Meeteetse: 45 minuti che servono al Trails Center di Casper.", "grave": false}, {"t": "TOLTO Fort Caspar: chiude anch'esso alle 17 ed e la versione minore del Trails Center.", "grave": false}], "pranzo": "COLAZIONE - 8th Street at the Ivy, 1800 8th St, Cody. Apre alle 7:00. Vi serve presto: il museo apre alle 8.\n(Sitti's Table, 1022 13th St, e' migliore - 4,9 stelle - ma apre alle 7:30, troppo tardi per voi.)\n\nPRANZO - One Eyed Buffalo Brewing, 535 Broadway, Thermopolis. Gio 11:00-21:30. Bison burger, il piatto della casa. NB: i cavolini di Bruxelles arrivano crudi, prendete le patate.\nAlt. diner: 7 Lazy S Cafe, 109 S 6th St, dalle 6:00.\nEVITARE Thermopolis Safari Club (3,8 stelle, recensioni recenti pessime).", "cena": "Silver Fox Steakhouse IMPERDIBILE, 3422 Energy Ln, Casper. Gio fino alle 21. Il migliore della citta'. Prenotare: 307-235-3000.\nAlt.: FireRock Steakhouse, 6100 E 2nd St, fino alle 22."}, {"data": "2026-09-18", "etichetta": "Ven 18", "regione": "Devils Tower", "aL": "#3D6B3F", "aD": "#86B98A", "svg": "<path d=\"M0,80 L0,70 C60,66 110,62 150,60 L250,60 C290,62 340,66 400,70 L400,80 Z\"/><path d=\"M172,62 L176,26 L180,16 L187,10 L200,8 L213,10 L220,16 L224,26 L228,62 Z\"/>", "da": "Casper", "a": "Rapid City", "via": "", "km": 523, "guida": "5h35", "dormire": "Rapid City", "costo": "182.5", "segmenti": [{"da": "Casper", "a": "Devils Tower", "km": 302, "t": "3h00", "tappe": [{"ora": "7:30", "testo": "partenza (NON le 8: servono i 30 minuti). Benzina a Gillette.", "luogo": null}, {"ora": "10:30–12:15", "testo": "DEVILS TOWER, primo monumento nazionale USA. TOWER TRAIL 2 km ad anello, IN SENSO ANTIORARIO: tieni la torre a sinistra e arrivi alla parete sud con la luce del primo pomeriggio. Prairie Dog Town all'ingresso, 10 min.", "luogo": "Devils Tower National Monument, Wyoming"}]}, {"da": "Devils Tower", "a": "Deadwood", "km": 119, "t": "1h10", "tappe": [{"ora": "12:15–13:35", "testo": "Devils Tower - I-90 est fino a SPEARFISH.", "luogo": "Spearfish, South Dakota"}, {"ora": "13:35–14:40", "testo": "SPEARFISH CANYON (US-14A) PERCORSO VERSO SUD: arrivando da Devils Tower incontrate prima Spearfish, che e l'estremita NORD del canyon. Roughlock Falls e Bridal Veil Falls, pareti di calcare a picco.", "luogo": "Roughlock Falls Nature Area, Lead, SD"}, {"ora": "14:50–16:00", "testo": "DEADWOOD: pranzo tardi. Parcheggio multipiano su Sherman S", "luogo": "Sherman Street Parking Lot, Deadwood, SD"}]}, {"da": "Deadwood", "a": "Rapid City", "km": 102, "t": "1h25", "tappe": [{"ora": "16:00–17:15", "testo": "Deadwood - Sturgis - I-90 est - RAPID CITY.", "luogo": "Rapid City, South Dakota"}]}], "avvisi": [{"t": "GIORNATA CON PIU GUIDA DEL VIAGGIO: 5h35.", "grave": false}, {"t": "NB: l'ordine precedente (Deadwood, poi canyon verso nord, poi Rapid City) faceva passare due volte dalla zona di Spearfish. Cosi e un giro solo.", "grave": true}, {"t": "RIPIEGO se saltate il canyon: Deadwood - US-385 diretta, 50 min risparmiati", "grave": true}], "pranzo": "Jacobs Brewhouse, 79 Sherman St, Deadwood. Ven 11:00-22:00. Menu stagionale, molto sopra la media dei saloon per turisti.\nSaloon No.10 (657 Main St): e' il locale dove fu ucciso Wild Bill Hickok, con la rievocazione della sparatoria. Andateci per la storia e una birra, non per mangiare.\nDEADWOOD - pranzo, opzioni migliori:\n1. DEADWOOD SOCIAL CLUB, sopra il Saloon No.10: si mangia letteralmente sopra al saloon dove fu ucciso Wild Bill Hickok. Tradizione americana con tocchi gourmet, ottimi i bison burger. Elegante ma con anima western. RISOLVE il problema di dover scegliere fra il locale storico e mangiare bene.\n2. LEGENDS STEAKHOUSE / The Midnight Star, Main St: il casino era di Kevin Costner, pareti tappezzate di memorabilia da Balla coi Lupi. Per i cinefili.\n3. ZOMBIES BAR & GRILL, 662 Main St: tema horror, pub americano, birre artigianali. Se cercate qualcosa di diverso dal western.\n4. CHUBBY CHIPMUNK, cioccolatini artigianali fatti a mano - truffles al burro d'arachidi e tartufi al whisky locale. Sosta da 10 minuti.\nParcheggio multipiano su Sherman St.\nColazione: Harriet etc Sickies Garage\n\nMurphy’s Pub & Grill, Firehouse Brewing Co.", "cena": "Tally's Silver Spoon, 530 6th St, Rapid City. Fino alle 21. Il migliore della citta', cucina ambiziosa in un ex diner. Fanno un menu degustazione da 3 portate con abbinamento vini a prezzo onesto. Prenotare: 605-342-7621.\n\nCulver's - FROZEN CUSTARD"}, {"data": "2026-09-19", "etichetta": "Sab 19", "regione": "Badlands", "aL": "#8C6239", "aD": "#D2A377", "svg": "<path d=\"M0,80 L0,62 L14,44 L22,60 L34,36 L44,58 L56,42 L66,62 L78,34 L90,58 L102,46 L114,64 L128,38 L140,60 L152,48 L166,64 L180,40 L192,58 L206,44 L218,62 L232,36 L244,58 L258,46 L270,64 L284,40 L296,60 L310,48 L324,62 L338,38 L350,58 L364,46 L378,64 L392,50 L400,60 L400,80 Z\"/>", "da": "Rapid City", "a": "Rapid City", "via": "Wall - Badlands", "km": 290, "guida": "3h20", "dormire": "Rapid City", "costo": "182.5", "segmenti": [{"da": "Rapid City", "a": "Minuteman Missile NHS", "km": 90, "t": "1h00", "tappe": [{"ora": "8:30", "testo": "partenza.", "luogo": null}, {"ora": "9:30–10:15", "testo": "MINUTEMAN MISSILE NHS, uscita 131 della I-90, GRATUITO. Un silo con dentro un Minuteman II ancora al suo posto e il centro di controllo sotterraneo. Racconta la Guerra Fredda meglio di qualsiasi museo.\n(Il tour del Delta-01 va prenotato su recreation.gov e dura un'ora: se ti interessa prenotalo ora e sposta tutto avanti di 1h.)", "luogo": "Minuteman Missile National Historic Site Visitor Center, 24545 Cottonwood Rd, Philip, SD"}, {"ora": "10:25–10:40", "testo": "SILO DELTA-09, il missile visibile dall'esterno.", "luogo": "Delta-09 Missile Silo, Badlands, SD"}]}, {"da": "Minuteman Missile NHS", "a": "Wall - Badlands", "km": 100, "t": "1h20", "tappe": [{"ora": "11:00–12:15", "testo": "WALL DRUG, 800 Main St: nato negli anni '30 regalando acqua agli automobilisti assetati, oggi e un isolato intero. Backyard col dinosauro e il coniglio gigante, Travelers Chapel, ciambella e caffe da 5 centesimi. Anche il cibo e ok.", "luogo": "Wall Drug Store, Wall, South Dakota"}, {"ora": "12:15–13:15", "testo": "pranzo a Wall + BENZINA (dentro il parco non ce n'e).", "luogo": "Salty Steer, 600 Main St, Wall, South Dakota"}, {"ora": "13:30–15:00", "testo": "SAGE CREEK RIM ROAD: 20 km di sterrata facile lungo il bordo nord-ovest. Bisonti, bighorn, Roberts Prairie Dog Town. E' la parte migliore delle Badlands e ci va un decimo delle persone. Evitare solo dopo pioggia forte.", "luogo": "Roberts Prairie Dog Town, Badlands National Park"}, {"ora": "15:20–16:45", "testo": "BADLANDS LOOP ROAD: Yellow Mounds, Panorama Point, Big Badlands Overlook.\nBADLANDS LOOP ROAD verso EST: Yellow Mounds, Panorama Point, poi Fossil Exhibit Trail.", "luogo": "Yellow Mounds Overlook, Badlands National Park"}, {"ora": "16:45–17:30", "testo": "Door e Window Trail (+ Notch, decidere sul posto).", "luogo": "Door and Window Parking Area, Badlands National Park"}, {"ora": "17:45", "testo": "BIG BADLANDS OVERLOOK: e il punto piu a EST della Loop Road, quindi va per ultimo.", "luogo": "Big Badlands Overlook, Badlands National Park"}, {"ora": "18:00", "testo": "ritorno verso ovest fino ai Pinnacles per il tramonto\nATTENZIONE: la discesa al ritorno e piu impegnativa della salita, e DOPO la scala c'e un tratto in cornice sul fianco della scogliera. Se la scala sembra fattibile ma solo al limite, NON salire: il punto difficile viene dopo.\nSE SI SALE: 1 ora, vista finale sulla White River Valley.\nSE NO: DOOR TRAIL (1,2 km, attraversa un varco nella parete) e WINDOW TRAIL (400 m), entrambi piani e senza esposizione, dallo stesso parcheggio.\nALTERNATIVA: CLIFF SHELF NATURE TRAIL, 800 m di passerelle e scalinate CON CORRIMANO in mezzo a vegetazione insolitamente verde.\nSe ha piovuto nelle ore precedenti, saltare comunque: il fango delle Badlands e scivoloso e i pioli bagnati non perdonano.", "luogo": null}, {"ora": "17:45–18:15", "testo": "FOSSIL EXHIBIT TRAIL: 400 m su passerella piana, calchi dei fossili trovati proprio li.", "luogo": "Fossil Exhibit Trail, Badlands National Park"}]}, {"da": "Badlands (Pinnacles)", "a": "Rapid City", "km": 100, "t": "1h00", "tappe": [{"ora": "18:30–19:45", "testo": "PINNACLES OVERLOOK - TRAMONTO. Il sole cala verso le 19:15: arrivate mezz'ora prima e aspettate. Le stratificazioni passano da grigie a rosse in 20 minuti. E' l'unico giorno del viaggio in cui potete permettervi di restare fino al buio.", "luogo": "Pinnacles Overlook, Badlands National Park"}, {"ora": "20:45", "testo": "rientro a Rapid City. Cena da Murphy's Pub & Grill, 510 9th St, aperto fino alle 22 (il Dakota Meat Co chiude alle 20).", "luogo": "Murphy's Pub and Grill, 510 9th St, Rapid City, SD"}]}], "avvisi": [{"t": "GIORNATA PIU ELASTICA DEL VIAGGIO: oltre 1h30 di margine.", "grave": false}, {"t": "Portate acqua abbondante: le Badlands sono aride e senza ombra, a settembre nel pomeriggio si arriva a 25-28 gradi.", "grave": false}], "pranzo": "Salty Steer, 600 Main St, Wall. Aperto tutti i giorni 10-22. Bistecche grass-fed, molto sopra la media del paese.\nEVITARE il ristorante dentro Wall Drug: trappola turistica. Andateci per la ciambella e il caffe' da 5 centesimi, non per pranzo.", "cena": "Murphy's Pub & Grill, 510 9th St, Rapid City. Aperto fino alle 22.\nE' la scelta giusta perche restando alle Badlands per il tramonto (19:15) rientrate verso le 20:45, e il Dakota Meat Company chiude alle 20:00.\nAlternativa fino alle 21: Colonial House, 2315 Mt Rushmore Rd.\nSe invece rinunciate al tramonto: Dakota Meat Company, 502 Main St, hamburger da carne locale, i migliori della zona.\n\nCulver's - FROZEN CUSTARD"}, {"data": "2026-09-20", "etichetta": "Dom 20", "regione": "Black Hills · Rushmore", "aL": "#2F5A44", "aD": "#7FB79A", "svg": "<path d=\"M0,80 L0,60 C60,52 140,58 200,52 C270,45 330,56 400,50 L400,80 Z\"/><path d=\"M34,58 L42,32 L50,58 Z M76,56 L84,26 L92,56 Z M124,57 L131,36 L138,57 Z M186,52 L194,22 L202,52 Z M244,50 L251,30 L258,50 Z M300,53 L308,28 L316,53 Z M352,51 L359,34 L366,51 Z\"/>", "da": "Rapid City", "a": "Alliance", "via": "", "km": 310, "guida": "4h15", "dormire": "Alliance", "costo": "90", "segmenti": [{"da": "Rapid City", "a": "Mount Rushmore", "km": 37, "t": "0h45", "tappe": [{"ora": "7:15", "testo": "partenza (7:30 se fate Carhenge domattina invece che stasera).", "luogo": null}, {"ora": "8:00–9:30", "testo": "MOUNT RUSHMORE: i volti guardano a sud-est, la mattina hanno la luce addosso e dal pomeriggio vanno in ombra. Alle 8 il piazzale e vuoto, alle 11 e pieno di pullman. Grand View Terrace + Presidential Trail.", "luogo": "Mount Rushmore National Memorial, 13000 SD-244, Keystone, SD"}]}, {"da": "Mount Rushmore", "a": "Custer State Park", "km": 87, "t": "1h30", "tappe": [{"ora": "9:45–10:45", "testo": "IRON MOUNTAIN ROAD (16A) DA NORD VERSO SUD: i 3 tunnel sono scavati per inquadrare i volti guardando indietro, e solo in questo senso l'effetto funziona. Pigtail bridges, 314 curve.", "luogo": "Doane Robinson Tunnel, Iron Mountain Road, Keystone, SD"}, {"ora": "11:00–12:00", "testo": "NEEDLES HIGHWAY (87): guglie di granito, NEEDLE'S EYE TUNNEL largo 2,6 m e alto 3,6 - la vostra SUV passa, ma piano e non in due.", "luogo": "Needles Eye Tunnel, Custer State Park, SD"}, {"ora": "12:00–12:45", "testo": "SYLVAN LAKE.", "luogo": "Sylvan Lake Day Use Area, Custer State Park, SD"}, {"ora": "13:00–14:00", "testo": "pranzo a Custer (Buglin' Bull, l'unico buono aperto la domenica).", "luogo": "Buglin' Bull Restaurant and Sports Bar, 511 Mt Rushmore Rd, Custer, SD"}, {"ora": "14:15–16:00", "testo": "WILDLIFE LOOP ROAD: 1.500 bisonti. Si muovono all'alba e al tramonto, non a mezzogiorno - per questo e nel pomeriggio. Gli asinelli si avvicinano ai finestrini: non dategli da mangiare, mordono.", "luogo": "Wildlife Station Visitor Center, Custer State Park, SD"}]}, {"da": "Custer", "a": "Alliance", "km": 186, "t": "2h00", "tappe": [{"ora": "16:00", "testo": "uscita dalla Wildlife Loop verso SUD sulla SD-87: siete gia sulla direttrice per Alliance.", "luogo": null}, {"ora": "16:40", "testo": "BENZINA A HOT SPRINGS, sulla US-385. Tornare a Custer sono 20 km e 20 minuti in piu.", "luogo": "Hot Springs, South Dakota"}, {"ora": "18:50–19:10", "testo": "CARHENGE, 5 km a NORD di Alliance sulla US-385: ci passate davanti arrivando da Custer. TRAMONTO ALLE 19:15 e non e illuminato: per vederlo dovete partire da Custer entro le 17:00.", "luogo": "Carhenge, 2151 County Rd 59, Alliance, NE"}, {"ora": "19:20", "testo": "Alliance. Cena da Runza, 2461 US-385, aperto fino alle 22 (e sulla vostra strada).", "luogo": "Runza, 2461 US-385, Alliance, Nebraska"}]}], "avvisi": [{"t": "DOMENICA - a Custer chiudono Custer Wolf, Skogen Kitchen e Custer Beacon.", "grave": true}, {"t": "NB: il PARCHEGGIO SI PAGA (10-15 $) e NON e coperto dall'America the Beautiful (concessionario privato). L'ingresso al monumento e gratuito.", "grave": true}, {"t": "PIANO B: se alle 16:00 siete in ritardo NON tagliate la Wildlife Loop. Arrivate ad Alliance alle 20, cenate, e fate Carhenge il 21 alle 7:55 tornando indietro 10 km (costo reale: 5 minuti).", "grave": true}], "pranzo": "ATTENZIONE - E' DOMENICA. A Custer chiudono i tre migliori: Custer Wolf, Skogen Kitchen e Custer Beacon.\n>> Buglin' Bull, 511 Mt Rushmore Rd, Custer. Aperto dom 11-21. Porzioni enormi, prezzi onesti.", "cena": "RUNZA, I panino di pasta lievitata ripieno di manzo, cavolo e cipolla è di origine tedesco-russa e non lo trovate altrove al mondo"}, {"data": "2026-09-21", "etichetta": "Lun 21", "regione": "Oregon Trail · Scotts Bluff", "aL": "#8A7A34", "aD": "#D4C36A", "svg": "<path d=\"M0,80 L0,68 L118,68 L138,66 L158,40 L172,32 L200,30 L228,34 L242,46 L252,68 L400,68 L400,80 Z\"/>", "da": "Alliance", "a": "Cheyenne", "via": "", "km": 416, "guida": "4h35", "dormire": "Cheyenne", "costo": "107.54", "segmenti": [{"da": "Alliance", "a": "Chimney Rock", "km": 74, "t": "0h55", "tappe": [{"ora": "7:45", "testo": "partenza da Alliance (Taco John's apre alle 6 per la colazione).", "luogo": null}, {"ora": "7:55–8:15", "testo": "CARHENGE, se non fatto ieri sera: 5 km a nord, si torna indietro.", "luogo": "Carhenge, 2151 County Rd 59, Alliance, NE"}, {"ora": "9:25–10:20", "testo": "CHIMNEY ROCK: il punto di riferimento piu citato nei diari dei pionieri. Visitor center + vista. E' IL SACRIFICABILE N.1 (una guglia che si guarda da lontano).", "luogo": "Chimney Rock National Historic Site, Bayard, NE"}]}, {"da": "Chimney Rock", "a": "Scottsbluff", "km": 36, "t": "0h25", "tappe": [{"ora": "10:45–12:15", "testo": "SCOTTS BLUFF NM: SALITE IN AUTO sulla Summit Road, 2,5 km e 3 tunnel scavati nell'arenaria fino in cima ai 250 m della falesia. Dall'alto tutta la valle del North Platte: per i pionieri era il segnale che le Grandi Pianure finivano. In basso, Oregon Trail Pathway ai solchi originali dei carri (10 min a piedi).", "luogo": "Scotts Bluff National Monument, 190276 Old Oregon Trail, Gering, NE"}, {"ora": "12:30–13:30", "testo": "pranzo a Scottsbluff + const app = document.getElementById('app');

const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const scuro = window.matchMedia('(prefers-color-scheme: dark)');

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* numeri di telefono e indirizzi web diventano cliccabili */
function arricchisci(s){
  let h = esc(s);
  h = h.replace(/(\+?1[\s-]?)?\(?\b(\d{3})\)?[\s-](\d{3})-(\d{4})\b/g,
    (m,p,a,b,c)=>`<a class="tel" href="tel:+1${a}${b}${c}">${m}</a>`);
  h = h.replace(/\b((?:https?:\/\/)?(?:www\.)?[a-z0-9-]+\.(?:com|gov|org|net|it)(?:\/[^\s,;)]*)?)/gi,
    m=>{const url = m.startsWith('http') ? m : 'https://'+m;
        return `<a class="web" href="${url}" target="_blank" rel="noopener">${m}</a>`;});
  return h;
}

function appleUrl(q){return 'https://maps.apple.com/?daddr='+encodeURIComponent(q)+'&dirflg=d';}
function googleUrl(q){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q)+'&travelmode=driving';}

function tappeDi(g){return g.segmenti.reduce((a,s)=>a.concat(s.tappe),[]);}

/* Google Maps accetta al massimo 9 tappe intermedie oltre a partenza e arrivo. */
function percorsoGiornata(g){
  const punti = tappeDi(g).filter(t=>t.luogo).map(t=>t.luogo);
  const unici = punti.filter((p,i)=>i===0||p!==punti[i-1]);
  if(unici.length < 2) return null;
  const partenza = unici[0], arrivo = unici[unici.length-1];
  let mezzo = unici.slice(1,-1), tagliate = 0;
  if(mezzo.length > 9){
    const passo = mezzo.length / 9, scelte = [];
    for(let i=0;i<9;i++) scelte.push(mezzo[Math.round(i*passo)]);
    tagliate = mezzo.length - scelte.length;
    mezzo = scelte;
  }
  return {
    url:'https://www.google.com/maps/dir/?api=1'
      + '&origin=' + encodeURIComponent(partenza)
      + '&destination=' + encodeURIComponent(arrivo)
      + (mezzo.length ? '&waypoints=' + mezzo.map(encodeURIComponent).join('|') : '')
      + '&travelmode=driving',
    soste: mezzo.length + 2,
    tagliate
  };
}

/* Il titolo e' il blocco in maiuscolo iniziale; il resto scende nel testo. */
function spezza(riga){
  const parole = riga.split(' ');
  const connettori = ['+','-','&','/','–','e'];
  let n = 0;
  while(n < parole.length){
    const w = parole[n];
    if(!w){ n++; continue; }
    const maiuscolo = !/[a-zà-öø-ÿ]/.test(w) && w[0] !== '(';
    const utile = /[A-ZÀ-Ý]/.test(w) || connettori.includes(w);
    if(maiuscolo && utile) n++; else break;
  }
  const testa = parole.slice(0,n).join(' ');
  if(testa.replace(/[^A-Za-zÀ-ÿ]/g,'').length >= 4){
    let capo = testa;
    const fine = capo.indexOf('. ');
    if(fine > 3) capo = capo.slice(0, fine);
    capo = capo.replace(/[:,\-–\/\s.]+$/,'');
    return [capo, riga.slice(capo.length).replace(/^[:,\-–\s]+/,'')];
  }
  // niente blocco in maiuscolo: si taglia alla prima pausa naturale
  const pause = [': ', '. ', ' ('].map(p=>riga.indexOf(p)).filter(x=>x > 8);
  if(pause.length){
    const taglio = Math.min(...pause);
    return [riga.slice(0,taglio).trim(), riga.slice(taglio).replace(/^[:.\s]+/,'')];
  }
  if(riga.length <= 80) return [riga, ''];
  let taglio = riga.lastIndexOf(' ', 70);
  if(taglio < 24) taglio = 70;
  return [riga.slice(0,taglio).trim()+'…', riga.slice(taglio).trim()];
}

/* Testi lunghi: resta visibile l'inizio, il resto va in una tendina "Note". */
const SOGLIA = 150;
function accumula(pezzi, unione){
  const visibili = [], resto = [];
  let somma = 0;
  pezzi.forEach((p, i) => {
    if(i === 0 || (resto.length === 0 && somma + p.length <= SOGLIA)){
      visibili.push(p); somma += p.length;
    } else resto.push(p);
  });
  return [visibili.join(unione), resto.join(unione)];
}
function dividiCorpo(corpo){
  if(!corpo) return ['', ''];
  // prima si divide per righe...
  let [visibile, resto] = corpo.indexOf('\n') >= 0
    ? accumula(corpo.split('\n'), '\n')
    : [corpo, ''];
  // ...e se quel che resta a vista e' ancora un muro, si taglia per frasi
  if(visibile.length > 220){
    const pezzi = visibile.split('. ');
    if(pezzi.length > 1){
      const frasi = pezzi.map((p, i) => i < pezzi.length - 1 ? p + '.' : p);
      const [corta, avanzo] = accumula(frasi, ' ');
      visibile = corta;
      resto = avanzo + (resto ? '\n' + resto : '');
    }
  }
  return [visibile, resto];
}

function titolo(t){
  const righe = t.testo.split('\n');
  const [capo, resto] = spezza(righe[0]);
  return {capo, corpo:[resto, righe.slice(1).join('\n')].filter(Boolean).join('\n')};
}

/* Avviso: etichetta breve + testo. Se non si trova un'etichetta sensata,
   il testo resta intero e l'etichetta diventa generica. */
const ETICHETTE = /^(ATTENZIONE|VERIFICARE|NB|PIANO B|RIPIEGO|DOMENICA|TOLTO|OPZIONE [AB]|GIRO VIA NORRIS|DISTANZE DI SICUREZZA|STASERA|IL TIMED ENTRY)\b[\s:.\-–]*/;
function avviso(a){
  const righe = a.t.split('\n');
  const coda = righe.slice(1).join('\n');
  const prima = righe[0];
  const m = prima.match(ETICHETTE);
  if(m){
    const corpo = prima.slice(m[0].length);
    return {capo:m[1], corpo:[corpo, coda].filter(Boolean).join('\n')};
  }
  const parole = prima.split(' ');
  let n = 0;
  while(n < parole.length && parole[n] && !/[a-zà-öø-ÿ]/.test(parole[n]) && /[A-ZÀ-Ý]/.test(parole[n])) n++;
  const testa = parole.slice(0,n).join(' ').replace(/[:,\-–\/\s.]+$/,'');
  if(testa.replace(/[^A-Za-zÀ-ÿ]/g,'').length >= 4 && testa.length <= 46){
    return {capo:testa, corpo:[prima.slice(testa.length).replace(/^[:,\-–\s]+/,''), coda].filter(Boolean).join('\n')};
  }
  return {capo:'Nota', corpo:a.t};
}

/* pranzo e cena si attaccano alla tappa giusta, come nella v3 */
function extraDelGiorno(g){
  const tappe = tappeDi(g);
  const mappa = new Map();
  const aggiungi = (t,titolo,testo)=>{
    if(!t || !testo) return;
    if(!mappa.has(t)) mappa.set(t,[]);
    mappa.get(t).push({t:titolo, d:testo});
  };
  if(g.pranzo){
    let scelta = tappe.find(t=>/pranz/i.test(t.testo))
              || tappe.find(t=>{ const h = parseInt(t.ora,10); return h >= 11 && h <= 14; })
              || tappe.find(t=>/colazion|panino/i.test(t.testo));
    aggiungi(scelta || tappe[0], 'Colazione e pranzo', g.pranzo);
  }
  if(g.cena){
    let scelta = [...tappe].reverse().find(t=>/cena|cenat|ristorant/i.test(t.testo));
    aggiungi(scelta || tappe[tappe.length-1], 'Cena', g.cena);
  }
  return mappa;
}

function renderDay(i){
  const g = VIAGGIO[i];
  app.style.setProperty('--accent-l', g.aL);
  app.style.setProperty('--accent-d', g.aD);

  let h = `<div class="band"><svg viewBox="0 0 400 80" preserveAspectRatio="none" fill="currentColor">${g.svg}</svg></div><div class="pad">`;
  h += `<p class="region">${esc(g.regione)}</p>`;
  const lungo = (g.da + g.a).length > 30 ? ' lungo' : '';
  h += `<h1 class="route${lungo}">${esc(g.da)} <em>→</em> ${esc(g.a)}</h1>`;
  const bits = [];
  if(g.via) bits.push('via ' + g.via);
  if(g.km) bits.push(g.km + ' km');
  if(g.guida) bits.push(g.guida + ' di guida');
  if(g.dormire) bits.push('si dorme a ' + g.dormire);
  h += `<p class="meta">${esc(bits.join(' · '))}</p>`;

  const p = percorsoGiornata(g);
  if(p){
    h += `<a class="wholeday" href="${p.url}" target="_blank" rel="noopener">
      <div>
        <div class="lbl">Percorso della giornata</div>
        <div class="sub">${p.soste} soste su Google Maps${p.tagliate?' · '+p.tagliate+' minori escluse':''}</div>
      </div>
      <div class="arrow" aria-hidden="true">›</div>
    </a>`;
  }

  g.avvisi.forEach(a=>{
    const v = avviso(a);
    h += `<div class="alert${a.grave?'':' nota'}"><b>${esc(v.capo)}</b>${arricchisci(v.corpo)}</div>`;
  });

  const extra = extraDelGiorno(g);
  if(tappeDi(g).length){
    h += '<div class="section">La giornata</div><div class="strip">';
    g.segmenti.forEach(seg=>{
      if(seg.km){
        const parti = [seg.km + ' km'];
        if(seg.t) parti.push(seg.t);
        parti.push(seg.da + ' → ' + seg.a);
        h += `<div class="leg">${esc(parti.join(' · '))}</div>`;
      }
      seg.tappe.forEach(t=>{
        const {capo, corpo} = titolo(t);
        const [visibile, note] = dividiCorpo(corpo);
        h += `<div class="stop${t.luogo?' key':''}">
          <div class="time">${esc(t.ora)}</div>
          <div class="name">${esc(capo)}</div>
          ${visibile?`<p class="desc">${arricchisci(visibile)}</p>`:''}`;
        if(t.luogo){
          h += `<div class="nav">
            <a class="btn btn-a" href="${appleUrl(t.luogo)}">Naviga</a>
            <a class="btn btn-g" href="${googleUrl(t.luogo)}" target="_blank" rel="noopener">Google Maps</a>
          </div>`;
        }
        const tendine = note ? [{t:'Note', d:note}] : [];
        const ex = extra.get(t);
        if(ex) tendine.push(...ex);
        if(tendine.length){
          h += '<div class="more">';
          tendine.forEach(e=>{ h += `<details><summary>${esc(e.t)}</summary><div class="body">${arricchisci(e.d)}</div></details>`; });
          h += '</div>';
        }else{
          h += '<div style="height:9px"></div>';
        }
        h += '</div>';
      });
    });
    h += '</div>';
  }

  if(g.dormire){
    h += '<div class="section">Dove si dorme</div>';
    h += `<div class="hotel">
      <div class="nome">${esc(g.dormire)}</div>
      <a class="btn btn-a" style="margin-left:auto" href="${appleUrl(g.dormire + ', USA')}">Naviga</a>
    </div>`;
  }

  h += '</div>';
  app.innerHTML = h;
  window.scrollTo(0,0);
}

function renderNotti(){
  app.style.removeProperty('--accent-l');
  app.style.removeProperty('--accent-d');
  let h = '<div class="pad"><h1 class="route" style="margin-top:22px">Le notti</h1>'
        + '<p class="meta">14 pernottamenti</p>';
  VIAGGIO.forEach((g,i)=>{
    if(!g.dormire) return;
    const d = new Date(g.data+'T12:00:00');
    h += `<button type="button" class="nightrow" data-giorno="${i}" style="--rowaccent:${scuro.matches?g.aD:g.aL}">
      <div class="quando">${d.getDate()} ${MESI[d.getMonth()]}</div>
      <div class="dove">${esc(g.dormire)}${g.regione.toLowerCase()===g.dormire.toLowerCase()?'':`<small>${esc(g.regione)}</small>`}</div>
      <div class="freccia" aria-hidden="true">›</div>
    </button>`;
  });
  h += `<p class="totali">Nel foglio non ci sono nomi, indirizzi o numeri di prenotazione:
    aggiungeteli nella colonna Pernottamento e li porto qui.</p></div>`;
  app.innerHTML = h;
  app.querySelectorAll('.nightrow').forEach(b=>b.addEventListener('click',()=>{
    mostraGiorni(); select(parseInt(b.dataset.giorno,10));
  }));
  window.scrollTo(0,0);
}

let corrente = 0;
function select(i){
  corrente = i;
  [...daysBar.children].forEach((c,n)=>c.setAttribute('aria-pressed', n===i));
  renderDay(i);
}
function mostraGiorni(){
  tabGiorni.setAttribute('aria-pressed','true');
  tabNotti.setAttribute('aria-pressed','false');
  daysBar.hidden = false;
  select(corrente);
}
function mostraNotti(){
  tabGiorni.setAttribute('aria-pressed','false');
  tabNotti.setAttribute('aria-pressed','true');
  daysBar.hidden = true;
  renderNotti();
}
tabGiorni.addEventListener('click', mostraGiorni);
tabNotti.addEventListener('click', mostraNotti);
scuro.addEventListener('change', ()=>{ if(tabNotti.getAttribute('aria-pressed')==='true') renderNotti(); });

const oggi = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
VIAGGIO.forEach((g,i)=>{
  const b = document.createElement('button');
  b.className = 'chip' + (g.data===oggi ? ' oggi' : '');
  b.type = 'button';
  b.textContent = g.etichetta;
  b.setAttribute('aria-pressed','false');
  b.addEventListener('click',()=>select(i));
  daysBar.appendChild(b);
});

const idx = VIAGGIO.findIndex(g=>g.data===oggi);
if(idx>=0){
  select(idx);
}else{
  notice.hidden = false;
  notice.textContent = 'Oggi non è un giorno di viaggio — apro il 12 settembre';
  select(0);
}
document.getElementById('pie').textContent = 'Dati dal foglio USA 2026 (WIP) · versione 31/08/2026';

/* L'icona puo' essere caricata come icona180.png oppure icona-180.png:
   se il nome senza trattino non risponde, si riscrivono i link con l'altro. */
(function(){
  const prova = new Image();
  prova.onerror = function(){
    document.querySelectorAll('link[rel*="icon"]').forEach(l=>{
      const h = l.getAttribute('href');
      if(h && h.indexOf('icona') === 0) l.setAttribute('href', h.replace('icona','icona-'));
    });
  };
  prova.src = 'icona180.png';
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
